[project]
name = "budget-pipelines"
version = "0.1.0"
description = "Finance-ledger ingestion and reconciliation for the budget tracker"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
